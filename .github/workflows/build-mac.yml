name: macOS Packages
on:
  push:
    tags:
    - 'v*'
    # TEMPORARY - A push to this branch triggers the workflow
    branches:
    - 'macos-build'
  workflow_dispatch:

env:
  # wx >= 3.2.11 for bundled libpng to avoid TARGET_OS_MAC
  WX_VERSION: "3.2.11"
  CFITSIO_VERSION: "4.6.4"
  LIBNOVA_VERSION: "0.16"
  # Homebrew's eigen is 5.x, so track debian trixie version
  EIGEN_VERSION: "3.4.0"

jobs:
  build-mac:
    name: macos/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: arm64, runs-on: macos-15 }

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      # autoconf/automake/libtool are needed to regenerate libnova's configure
      run: brew install gettext autoconf automake libtool

    - name: Put gettext on PATH
      run: echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

    - name: Cache static dependencies
      id: deps-cache
      uses: actions/cache@v5
      with:
        path: ~/macdeps
        key: macdeps-${{ matrix.arch }}-wx${{ env.WX_VERSION }}-cfitsio${{ env.CFITSIO_VERSION }}-libnova${{ env.LIBNOVA_VERSION }}-eigen${{ env.EIGEN_VERSION }}

    - name: Build static dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: |
        set -eux
        prefix=$HOME/macdeps
        cores=$(sysctl -n hw.logicalcpu)
        mkdir -p ~/depsrc && cd ~/depsrc

        # wxWidgets
        curl -fLO "https://github.com/wxWidgets/wxWidgets/releases/download/v$WX_VERSION/wxWidgets-$WX_VERSION.tar.bz2"
        tar xf "wxWidgets-$WX_VERSION.tar.bz2"
        cd "wxWidgets-$WX_VERSION"

        ./configure --prefix="$prefix" --disable-shared --with-osx_cocoa \
                    --with-macosx-version-min=14.0 \
                    --with-libpng=builtin \
                    --with-libjpeg=builtin \
                    --with-libtiff=builtin \
                    --with-regex=builtin \
                    --with-expat=builtin \
                    --disable-tests \
                    --disable-precomp-headers
        make -j"$cores"
        make install
        cd ..

        # cfitsio
        curl -fLO "https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-$CFITSIO_VERSION.tar.gz"
        tar xf "cfitsio-$CFITSIO_VERSION.tar.gz"
        cmake -S "cfitsio-$CFITSIO_VERSION" -B build-cfitsio \
              -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
        cmake --build build-cfitsio -j"$cores"
        cmake --install build-cfitsio

        # libnova
        curl -fLO "http://deb.debian.org/debian/pool/main/libn/libnova/libnova_$LIBNOVA_VERSION.orig.tar.xz"
        tar xf "libnova_$LIBNOVA_VERSION.orig.tar.xz"
        cd libnova
        echo "$LIBNOVA_VERSION" > .tarball-version
        PATH="$(brew --prefix libtool)/libexec/gnubin:$PATH" autoreconf -i
        ./configure --prefix="$prefix" --disable-shared --enable-static \
                    CFLAGS="-mmacosx-version-min=14.0"
        make -j"$cores"
        make install
        cd ..

        # Eigen
        curl -fLO "https://gitlab.com/libeigen/eigen/-/archive/$EIGEN_VERSION/eigen-$EIGEN_VERSION.tar.gz"
        tar xf "eigen-$EIGEN_VERSION.tar.gz"
        cmake -S "eigen-$EIGEN_VERSION" -B build-eigen \
              -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_TESTING=OFF
        cmake --install build-eigen

        # Fail if anything came out shared
        test -f "$prefix/lib/libcfitsio.a"
        test -f "$prefix/lib/libnova.a"
        test -x "$prefix/bin/wx-config"
        test -d "$prefix/include/eigen3/Eigen"
        ! ls "$prefix"/lib/*.dylib 2>/dev/null

    - name: Build
      run: |
        export PATH="$HOME/macdeps/bin:$PATH"
        export CMAKE_PREFIX_PATH="$HOME/macdeps"
        build/build-mac

    - name: Package as DMG
      run: |
        cd tmp
        base=$(basename "$(ls PHD2-*.zip | head -1)" .zip)
        cpack -G DragNDrop -D CPACK_PACKAGE_FILE_NAME="$base"

    - name: Upload app
      uses: actions/upload-artifact@v6
      with:
        name: phd2-macos-${{ matrix.arch }}
        path: |
          tmp/PHD2-*.zip
          tmp/PHD2-*.dmg
        if-no-files-found: error
